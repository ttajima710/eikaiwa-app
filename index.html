<style>
  :root{
    --blue:#4F6DF5; --blue-d:#3f57d6;
    --done:#22B573; --failed:#F2935C; --uncheck:#CFD3DD;
    --ink:#2A2F3A; --sub:#929AAC; --line:#EEF0F5; --bg:#F4F6FB;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--blue);
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  /* スマホ実機では全画面、PCでは端末風の枠 */
  #app{
    width:100%;max-width:430px;height:100vh;max-height:100vh;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
    position:relative;
  }
  @media(min-width:480px){
    #app{height:92vh;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.28);}
  }
  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 24px;}
  .screen::-webkit-scrollbar{display:none;}
  h1.brand{font-weight:900;font-size:24px;letter-spacing:-.5px;line-height:1.2;}
  h1.brand span{color:var(--blue);}
  .muted{color:var(--sub);}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(60,70,120,.05);}
  .btn{all:unset;cursor:pointer;display:block;text-align:center;border-radius:12px;
    font-weight:700;padding:14px;font-size:15px;transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-done{background:var(--done);color:#fff;}
  .btn-failed{background:var(--failed);color:#fff;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;background:#fff;outline:none;}
  input:focus,select,textarea:focus{border-color:var(--blue);}
  label.fld{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px;}
  /* bottom nav */
  nav{display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.97);
    backdrop-filter:blur(8px);padding:7px 6px 9px;flex-shrink:0;}
  nav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:5px 0;color:var(--sub);}
  nav button.active{color:var(--blue);}
  nav span{font-size:10.5px;font-weight:700;}
  /* progress */
  .bar{height:10px;border-radius:99px;background:#E7EAF3;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    padding:5px 10px;border-radius:99px;}
  .chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:99px;
    border:1.5px solid var(--line);color:var(--sub);background:#fff;}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:90px;pointer-events:none;opacity:0;}
  .flash.show{animation:pop 1s ease;}
  @keyframes pop{0%{opacity:0;transform:scale(.4);}30%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.1);}}
  .toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:#2A2F3A;color:#fff;
    font-size:13px;font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:5;}
  .toast.show{opacity:.95;}
  .row{display:flex;gap:8px;}
  .listitem{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 4px rgba(60,70,120,.05);}
  .dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
  details summary{list-style:none;cursor:pointer;}
  details summary::-webkit-details-marker{display:none;}
  .cat-head{font-weight:700;font-size:12.5px;color:var(--blue);margin:18px 2px 8px;}
</style>
</head>
<body>
<div id="app">
  <div class="screen" id="screen"></div>
  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>
  <nav id="nav"></nav>
</div>

<script>
"use strict";
//============ データ読み込み ============
const EXCEL_PHRASES = (() => {
  try { return JSON.parse(document.getElementById('phrase-data').textContent) || []; }
  catch(e){ return []; }
})();

//============ 保存（localStorage） ============
const LS = {
  progress:'iet_progress',   // {id: 'done'|'failed'}
  user:'iet_user_phrases',   // 手動追加フレーズ [{id,jp,en,scene,note,category}]
  settings:'iet_settings',   // {goal, mode, hint}
  today:'iet_today',         // {date, done}
};
function load(key, def){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let progress = load(LS.progress, {});
let userPhrases = load(LS.user, []);
let settings = Object.assign({goal:20, mode:'review'}, load(LS.settings, {}));
let today = load(LS.today, {date:'', done:0});

// 日付が変わったら今日の達成数をリセット
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
if(today.date !== todayKey()){ today = {date:todayKey(), done:0}; save(LS.today, today); }

//============ フレーズ統合（Excel + 手動追加） ============
function allPhrases(){ return userPhrases.concat(EXCEL_PHRASES); }
function statusOf(id){ return progress[id] || null; }

//============ 出題プール ============
function pool(){
  const ph = allPhrases();
  if(settings.mode==='all') return ph.slice();
  if(settings.mode==='failed') return ph.filter(p=>statusOf(p.id)==='failed');
  return ph.filter(p=>statusOf(p.id)!=='done'); // review = 未チェック+できなかった
}

//============ 画面状態 ============
let screen = 'home';
let practiceIdx = 0;
let revealed = false;
let listFilter = 'all';
let listSearch = '';

//============ ユーティリティ ============
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function counts(){
  const ph=allPhrases(); let done=0,failed=0,unchecked=0;
  ph.forEach(p=>{const s=statusOf(p.id); if(s==='done')done++; else if(s==='failed')failed++; else unchecked++;});
  return {total:ph.length, done, failed, unchecked};
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function flash(type){
  const f=document.getElementById('flash');
  f.textContent = type==='done'?'⭕':'✕';
  f.style.color = type==='done'?'var(--done)':'var(--failed)';
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}

//============ アクション ============
function go(s){ screen=s; revealed=false; render(); }
function mark(status){
  const p=pool(); if(!p.length) return;
  const idx=practiceIdx % p.length;
  const cur=p[idx];
  progress[cur.id]=status; save(LS.progress, progress);
  today.done=Math.min(settings.goal||999, today.done+1); save(LS.today, today);
  flash(status);
  // 'done' は出題プールから抜けるので idx 据え置き、'failed' は残るので次へ進める
  const np=pool();
  if(np.length===0){ practiceIdx=0; }
  else if(status==='done'){ practiceIdx = idx % np.length; }
  else { practiceIdx = (idx+1) % np.length; }
  revealed=false; render();
}
function resetProgress(){
  if(!confirm('学習の進み具合（できた／できなかった）をすべてリセットします。よろしいですか？')) return;
  progress={}; save(LS.progress, progress);
  today={date:todayKey(), done:0}; save(LS.today, today);
  toast('進捗をリセットしました'); render();
}
function deleteUserPhrase(id){
  userPhrases=userPhrases.filter(p=>p.id!==id); save(LS.user, userPhrases);
  delete progress[id]; save(LS.progress, progress);
  toast('削除しました'); render();
}

//============ 画面描画 ============
function render(){
  const el=document.getElementById('screen');
  if(screen==='home') el.innerHTML=viewHome();
  else if(screen==='practice') el.innerHTML=viewPractice();
  else if(screen==='list') el.innerHTML=viewList();
  else if(screen==='settings') el.innerHTML=viewSettings();
  renderNav();
  bind();
  el.scrollTop=0;
}

function viewHome(){
  const c=counts();
  const goal=settings.goal||0;
  const pct=goal?Math.min(100,Math.round(today.done/goal*100)):0;
  return `
    <h1 class="brand">瞬間英作文<span>トレーナー</span></h1>
    <p class="muted" style="font-size:13px;margin:6px 0 18px;">日本語を見て、英語で言ってみよう</p>

    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="justify-content:space-between;align-items:baseline;">
        <div style="font-weight:700;font-size:14px;">今日の目標</div>
        <div style="font-weight:900;font-size:15px;"><span style="color:var(--blue);">${today.done}</span> / ${goal} 問</div>
      </div>
      <div class="bar" style="margin-top:10px;"><i style="width:${pct}%"></i></div>
      <div class="muted" style="font-size:11.5px;margin-top:8px;">${today.done>=goal&&goal>0?'🎉 今日の目標を達成しました！':'設定タブで目標数を変えられます'}</div>
    </div>

    <div class="row" style="gap:9px;margin-bottom:16px;">
      ${statCard('未チェック',c.unchecked,'var(--uncheck)')}
      ${statCard('できた',c.done,'var(--done)')}
      ${statCard('できなかった',c.failed,'var(--failed)')}
    </div>

    <button class="btn btn-primary" data-go="practice">練習をはじめる（${pool().length}問）</button>
    <button class="btn btn-ghost" data-go="list" style="margin-top:10px;">フレーズ一覧を見る（${c.total}問）</button>
  `;
}
function statCard(label,n,color){
  return `<div class="card" style="flex:1;text-align:center;padding:13px 6px;">
    <div style="font-weight:900;font-size:22px;color:${color};">${n}</div>
    <div class="muted" style="font-size:10.5px;margin-top:2px;">${label}</div></div>`;
}

function viewPractice(){
  const p=pool();
  const modeNote = settings.mode==='all'?'すべて出題中':settings.mode==='failed'?'できなかった問題のみ':'未チェック・できなかった問題を出題中';
  if(!p.length){
    return `<h1 class="brand">練習</h1>
      <div class="card" style="margin-top:40px;text-align:center;padding:40px 20px;">
        <div style="font-size:40px;">🎉</div>
        <div style="font-weight:700;margin-top:10px;">出題できる問題がありません</div>
        <div class="muted" style="font-size:12.5px;margin-top:6px;">設定タブで出題範囲を変えるか、進捗をリセットしてください。</div>
      </div>`;
  }
  const cur=p[practiceIdx % p.length];
  const answer = revealed ? `
    <div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;">
      <div style="font-weight:900;font-size:19px;line-height:1.5;">${esc(cur.en)}</div>
      ${cur.scene?`<div class="muted" style="font-size:12.5px;margin-top:10px;">💡 意味/利用シーン<br>${esc(cur.scene)}</div>`:''}
    </div>` : '';
  return `
    <div class="row" style="justify-content:space-between;align-items:center;">
      <h1 class="brand" style="font-size:20px;">練習</h1>
      <span class="pill" style="background:#EEF1FE;color:var(--blue);">${cur.category||'　'}</span>
    </div>
    <div class="muted" style="font-size:11.5px;margin:6px 0 14px;">${modeNote}・残り ${p.length} 問</div>

    <div class="card" style="min-height:200px;display:flex;flex-direction:column;justify-content:center;">
      <div style="font-size:21px;font-weight:700;line-height:1.6;">${esc(cur.jp)}</div>
      ${answer}
    </div>

    ${revealed
      ? `<div class="row" style="margin-top:14px;">
           <button class="btn btn-failed" data-mark="failed" style="flex:1;">✕ できなかった</button>
           <button class="btn btn-done" data-mark="done" style="flex:1;">⭕ できた</button>
         </div>`
      : `<button class="btn btn-primary" id="revealBtn" style="margin-top:14px;">答えを見る</button>`}
  `;
}

function viewList(){
  const q=listSearch.trim().toLowerCase();
  const STAT={done:['var(--done)','できた'],failed:['var(--failed)','できなかった'],null:['var(--uncheck)','未チェック']};
  let ph=allPhrases().filter(p=>{
    const s=statusOf(p.id);
    if(listFilter==='done'&&s!=='done')return false;
    if(listFilter==='failed'&&s!=='failed')return false;
    if(listFilter==='unchecked'&&s!==null)return false;
    if(q&&!(p.jp.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)))return false;
    return true;
  });
  // カテゴリ別にまとめる
  const groups={}; ph.forEach(p=>{(groups[p.category||'その他']=groups[p.category||'その他']||[]).push(p);});
  let body='';
  if(!ph.length){
    body=`<div style="text-align:center;padding:50px 20px;color:var(--sub);"><div style="font-size:34px;">🔍</div><div style="font-size:14px;margin-top:8px;">該当するフレーズがありません</div></div>`;
  } else {
    for(const cat of Object.keys(groups)){
      body+=`<div class="cat-head">${esc(cat)}（${groups[cat].length}）</div>`;
      body+=groups[cat].map(p=>{
        const s=statusOf(p.id); const st=STAT[String(s)];
        const isUser=p.id.startsWith('u_');
        return `<details class="listitem">
          <summary class="row" style="align-items:center;gap:10px;">
            <span class="dot" style="background:${st[0]};"></span>
            <span style="flex:1;font-size:14px;font-weight:700;">${esc(p.jp)}</span>
            <span class="muted" style="font-size:18px;">›</span>
          </summary>
          <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line);">
            <div style="font-weight:700;font-size:15px;">${esc(p.en)}</div>
            ${p.scene?`<div class="muted" style="font-size:12px;margin-top:8px;">💡 ${esc(p.scene)}</div>`:''}
            <div class="muted" style="font-size:11px;margin-top:8px;">状態: ${st[1]}</div>
            ${isUser?`<button class="btn btn-ghost" data-del="${p.id}" style="margin-top:10px;color:#D6584F;border-color:#F0D2D2;font-size:13px;padding:9px;">この追加フレーズを削除</button>`:''}
          </div>
        </details>`;
      }).join('');
    }
  }
  const chip=(v,l)=>`<button class="chip ${listFilter===v?'on':''}" data-filter="${v}">${l}</button>`;
  return `
    <h1 class="brand" style="font-size:20px;">フレーズ一覧</h1>
    <input id="searchBox" placeholder="日本語・英語で検索" value="${esc(listSearch)}" style="margin:12px 0 12px;">
    <div class="row" style="gap:7px;flex-wrap:wrap;margin-bottom:6px;">
      ${chip('all','すべて')}${chip('unchecked','未チェック')}${chip('done','できた')}${chip('failed','できなかった')}
    </div>
    <div style="margin-top:6px;">${body}</div>
  `;
}

function viewSettings(){
  const modeOpt=(v,l)=>`<option value="${v}" ${settings.mode===v?'selected':''}>${l}</option>`;
  return `
    <h1 class="brand" style="font-size:20px;">設定</h1>

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:700;font-size:15px;">1日の目標</div>
      <label class="fld">1日に解く目標の問題数</label>
      <input id="goalInput" type="number" min="1" max="999" inputmode="numeric" value="${settings.goal}">
    </div>

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:700;font-size:15px;">練習のしかた</div>
      <label class="fld">出題範囲</label>
      <select id="modeSelect">
        ${modeOpt('review','復習（未チェック＋できなかった）')}
        ${modeOpt('failed','できなかった問題のみ')}
        ${modeOpt('all','すべて')}
      </select>
    </div>

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:700;font-size:15px;">データ</div>
      <button class="btn btn-ghost" id="resetBtn" style="margin-top:12px;color:#D6584F;border-color:#F0D2D2;">学習の進捗をリセット</button>
    </div>
    <div style="height:10px;"></div>
  `;
}

//============ ナビ ============
function renderNav(){
  const items=[
    ['home','ホーム','M3 10.5 L12 3.2 L21 10.5 M5.2 9.4 V20 H18.8 V9.4'],
    ['practice','練習','CIRCLE'],
    ['list','一覧','M4 6h16 M4 12h16 M4 18h10'],
    ['settings','設定','GEAR'],
  ];
  document.getElementById('nav').innerHTML=items.map(([k,label,path])=>{
    let svg;
    if(path==='CIRCLE') svg='<circle cx="12" cy="12" r="8.2"></circle><circle cx="12" cy="12" r="3.6"></circle>';
    else if(path==='GEAR') svg='<circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v3 M12 18.5v3 M2.5 12h3 M18.5 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"></path>';
    else svg='<path d="'+path+'"></path>';
    return `<button class="${screen===k?'active':''}" data-go="${k}">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>
      <span>${label}</span></button>`;
  }).join('');
}

//============ イベント結合 ============
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(b.dataset.mark));
  const rv=document.getElementById('revealBtn'); if(rv) rv.onclick=()=>{revealed=true;render();};
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{listFilter=b.dataset.filter;render();});
  const sb=document.getElementById('searchBox'); if(sb) sb.oninput=()=>{listSearch=sb.value;
    // 入力位置を保つため部分更新
    const pos=sb.selectionStart; render(); const nb=document.getElementById('searchBox'); if(nb){nb.focus();nb.setSelectionRange(pos,pos);} };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('この追加フレーズを削除しますか？')) deleteUserPhrase(b.dataset.del); });

  const gi=document.getElementById('goalInput'); if(gi) gi.onchange=()=>{
    let v=parseInt(gi.value,10); if(isNaN(v)||v<1)v=1; if(v>999)v=999;
    settings.goal=v; save(LS.settings,settings); toast('目標を '+v+' 問にしました');
  };
  const ms=document.getElementById('modeSelect'); if(ms) ms.onchange=()=>{settings.mode=ms.value;save(LS.settings,settings);practiceIdx=0;toast('出題範囲を変更しました');};
  const rb=document.getElementById('resetBtn'); if(rb) rb.onclick=resetProgress;
}

render();
</script>
